# Session admission webhooks. manifests.yaml is generated by `task generate`
# from the markers in internal/admission; do not edit it.
#
# Both webhooks fail closed. Register them only where the manager serves
# them (webhook.enabled), or every session create is refused.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests.yaml
  - service.yaml

configurations:
  - kustomizeconfig.yaml

patches:
  # The configurations are cluster scoped in a control plane shared with other
  # services, so they carry service-specific names.
  - patch: |-
      - op: replace
        path: /metadata/name
        value: lookingglass-mutating
    target:
      kind: MutatingWebhookConfiguration
      name: mutating-webhook-configuration
  - patch: |-
      - op: replace
        path: /metadata/name
        value: lookingglass-validating
    target:
      kind: ValidatingWebhookConfiguration
      name: validating-webhook-configuration

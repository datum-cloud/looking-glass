# controller-gen points the webhooks at `webhook-service` in `system`; an
# overlay sets the real namespace and selector.
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: looking-glass
    app.kubernetes.io/component: manager

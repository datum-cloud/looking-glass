# Teach kustomize that webhook clientConfig.service points at a Service, so the
# namespace transform and name references rewrite it when an overlay sets
# `namespace:` or a name prefix.
namespace:
  - path: webhooks/clientConfig/service/namespace
    kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    create: false
  - path: webhooks/clientConfig/service/namespace
    kind: MutatingWebhookConfiguration
    group: admissionregistration.k8s.io
    create: false

nameReference:
  - kind: Service
    version: v1
    fieldSpecs:
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/name
      - kind: MutatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/name

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-lookingglass-datumapis-com-v1alpha-lookingglasssession
  failurePolicy: Fail
  name: mlookingglasssession.lookingglass.datumapis.com
  rules:
  - apiGroups:
    - lookingglass.datumapis.com
    apiVersions:
    - v1alpha
    operations:
    - CREATE
    resources:
    - lookingglasssessions
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-lookingglass-datumapis-com-v1alpha-lookingglasssession
  failurePolicy: Fail
  name: vlookingglasssession.lookingglass.datumapis.com
  rules:
  - apiGroups:
    - lookingglass.datumapis.com
    apiVersions:
    - v1alpha
    operations:
    - CREATE
    resources:
    - lookingglasssessions
  sideEffects: None
